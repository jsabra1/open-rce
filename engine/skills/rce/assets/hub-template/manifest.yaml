# RCE manifest: index of every project in this hub.
# Routine saves never edit it. /rce sort adds new projects and keywords from saves; rename or retire changes it on request.
# Routing matches each project's name, description and keywords. Each project's current state lives in its context.md.
projects:
  - name: "Example"
    folder: projects/example
    keywords: ["example", "sample project"]
    description: "A sample project showing the folder layout. Rename it or retire it with /rce retire Example."
    status: active
