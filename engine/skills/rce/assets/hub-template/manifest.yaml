# RCE manifest: index of every project in this hub.
# Routine saves never rewrite it; it changes only when a project is added, renamed or retired, or a keyword is added.
# Routing matches each project's name, description and keywords. Each project's current state lives in its context.md.
projects:
  - name: "Example"
    folder: projects/example
    keywords: ["example", "sample project"]
    description: "A sample project showing the folder layout. Rename it or retire it with /rcx retire Example."
    status: active
